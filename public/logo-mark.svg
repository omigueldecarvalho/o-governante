<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo de O Governante</title>
  <desc id="desc">Selo circular fictício com a letra G atravessada por uma faixa verde e dourada.</desc>
  <defs>
    <clipPath id="seal-clip">
      <circle cx="256" cy="256" r="194"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="232" fill="#0B1711"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#50DD7A" stroke-width="10"/>
  <circle cx="256" cy="256" r="194" fill="#F1EBD8"/>

  <g fill="#50DD7A">
    <circle cx="256" cy="49" r="7"/>
    <circle cx="463" cy="256" r="7"/>
    <circle cx="256" cy="463" r="7"/>
    <circle cx="49" cy="256" r="7"/>
  </g>

  <text x="256" y="350" text-anchor="middle" fill="#0B1711"
        font-family="Arial Black, Arial, sans-serif" font-size="278" font-weight="900">G</text>

  <g clip-path="url(#seal-clip)" transform="rotate(-21 256 256)">
    <rect x="-38" y="222" width="588" height="84" fill="#F3C957"/>
    <rect x="-38" y="231" width="588" height="66" fill="#50DD7A"/>
    <path d="M-38 231H550" stroke="#F4F5F1" stroke-width="5" opacity=".85"/>
    <path d="M-38 297H550" stroke="#28643C" stroke-width="5" opacity=".9"/>
  </g>

  <circle cx="256" cy="256" r="194" fill="none" stroke="#0B1711" stroke-width="8"/>
  <path d="M196 430h120" stroke="#50DD7A" stroke-width="9" stroke-linecap="round"/>
</svg>
