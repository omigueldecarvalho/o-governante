<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      O Governante — Jogo de Simulação Política Brasileira
    </title>

    <meta

      content="Tome decisões, enfrente crises, dispute eleições e descubra como a história lembrará seu governo em um jogo de sátira política brasileira."

    <meta
      name="author"
      content="Miguel Ferreira de Carvalho"
    />

    <link

    />

      name="theme-color"

    <script type="application/ld+json">
